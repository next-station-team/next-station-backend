spring.application.name=next-station-backend
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/nextstation;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.sql.init.mode=always
spring.h2.console.enabled=false

# Enable only after installing a stable VAPID key pair in the environment.
app.push.enabled=${PUSH_ENABLED:false}
app.push.public-key=${VAPID_PUBLIC_KEY:}
app.push.private-key=${VAPID_PRIVATE_KEY:}
app.push.subject=${VAPID_SUBJECT:}
app.push.timeout=5s
app.push.allowed-hosts=fcm.googleapis.com,web.push.apple.com,updates.push.services.mozilla.com
app.alarm.scheduler-enabled=${ALARM_SCHEDULER_ENABLED:true}
app.alarm.poll-delay-ms=1000
app.alarm.safety-margin=1m
app.alarm.max-attempts=3
app.alarm.retry-delay=10s
app.alarm.batch-size=100
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
