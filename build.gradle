plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nextstation'
version = '0.0.1-SNAPSHOT'
description = 'next-station-backend'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation('nl.martijndwars:web-push:5.1.2') {
        exclude group: 'org.bouncycastle', module: 'bcprov-jdk15on'
        exclude group: 'com.beust', module: 'jcommander'
        exclude group: 'org.apache.httpcomponents', module: 'httpasyncclient'
        exclude group: 'org.asynchttpclient', module: 'async-http-client'
        exclude group: 'org.bitbucket.b_c', module: 'jose4j'
    }
    implementation 'org.bouncycastle:bcprov-jdk18on:1.83'
    implementation 'org.bitbucket.b_c:jose4j:0.9.6'
    implementation 'org.springframework.boot:spring-boot-h2console'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    compileOnly 'org.projectlombok:lombok'
    runtimeOnly 'com.h2database:h2'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

springBoot {
    mainClass = 'com.nextstation.backend.NextStationBackendApplication'
}

tasks.register('generateVapidKeys', JavaExec) {
    description = 'Generate VAPID keys into a new, git-ignored .env.vapid file'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'com.nextstation.backend.push.VapidKeyGenerator'
}

tasks.named('test') {
    useJUnitPlatform()
}
