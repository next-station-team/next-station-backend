name: Backend and deployment checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Verify and build Java backend
        run: |
          chmod +x gradlew
          ./gradlew test bootJar --no-daemon
      - name: Verify deployment safety rules
        run: python3 -m unittest discover -s tests -v
      - name: Exercise Linux systemd deployment on the disposable runner
        run: python3 scripts/smoke_systemd.py
      - name: Upload tested executable JAR
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nextstation-backend-${{ github.sha }}
          path: build/libs/backend-0.0.1-SNAPSHOT.jar
          retention-days: 14
      - name: Upload Java test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-test-results-${{ github.sha }}
          path: build/reports/tests/test
          retention-days: 14
